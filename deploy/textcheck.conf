# Ubuntu: скопировать в /etc/nginx/sites-available/textcheck
# Затем: sudo ln -s /etc/nginx/sites-available/textcheck /etc/nginx/sites-enabled/textcheck
# Подставьте свой домен вместо textcheck.example.com

server {
    listen 80;
    listen [::]:80;
    server_name textcheck.example.com;

    root /var/www/textcheck;
    index index.html;

    access_log /var/log/nginx/textcheck.access.log;
    error_log  /var/log/nginx/textcheck.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(css|js|png|svg|ico|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
